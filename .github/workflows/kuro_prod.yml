name: Hg PROD Monitor 05:00

on:
  schedule:
    - cron: "0 22 * * *"   # 05:00 ไทย
  workflow_dispatch:

jobs:
  prod-monitor:
    name: Run PROD Monitor 05:00
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run PROD scripts
        env:
          WEBHOOK: ${{ secrets.WEBHOOK }}
          WEBHOOK1: ${{ secrets.WEBHOOK1 }}
          WEBHOOK2: ${{ secrets.WEBHOOK2 }}
        run: |
          python "EndfieldOS/Endfield.py"

      - name: Commit and Push PROD logs
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          mkdir -p Hg/log

          git add Hg/log

          if ! git diff --cached --quiet; then
            git commit -m "Update logs [skip ci]"
            git push https://x-access-token:${PAT}@github.com/${{ github.repository }} HEAD:Webhook
          else
            echo "No changes to commit"
          fi


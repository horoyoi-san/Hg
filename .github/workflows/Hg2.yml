name: Hg PROD Monitor 15:10

on:
  schedule:
    - cron: "10 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prod-monitor:
    name: Run PROD Monitor at 15:10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -U discord.py

      # =====================================================
      # Endfield Bot
      # =====================================================

      - name: Run Endfield Bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN_1 }}
        run: |
          python "Endfield/Arknights：Endfield.py"
          python "Endfield/明日方舟：终末地.py"

      # =====================================================
      # Commit Logs
      # =====================================================

      - name: Commit and Push PROD logs
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          mkdir -p Hg/log

          git add Hg/log

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update logs [skip ci]"

          git push origin HEAD:webhook